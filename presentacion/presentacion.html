<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿A qué chat le toca una persona primero? · TPO Ciencia de Datos</title>
<style>
:root {
  --mesa: #e3eae4;
  --mesa-linea: #cdd9d0;
  --mesa-linea-fuerte: #b5c5ba;
  --fondo-linea: #dde5df;
  --fondo-linea-fuerte: #d3ddd5;
  --papel: #fbfbf8;
  --acento: #1d5c4e;
  --tinta: #18222d;
  --tinta-2: #46535f;
  --tinta-3: #6b7885;
  --verde: #1d5c4e;
  --verde-claro: #cfe3d9;
  --cinta: #f2c230;
  --hilo: #cf432c;
  --hilo-claro: #f6d9d2;
  --azul: #2f5da8;
  --violeta: #b0457b;
  --naranja: #d9822b;
  --gris: #8a94a0;
  --display: "Bahnschrift", "DIN Alternate", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --texto: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0f1a17; overflow: hidden; }
body { font-family: var(--texto); color: var(--tinta); }

#marco { position: fixed; inset: 0; display: grid; place-items: center; }
#escenario {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform-origin: center center;
  background-color: var(--mesa);
  background-image:
    linear-gradient(var(--fondo-linea-fuerte) 1px, transparent 1px),
    linear-gradient(90deg, var(--fondo-linea-fuerte) 1px, transparent 1px),
    linear-gradient(var(--fondo-linea) 1px, transparent 1px),
    linear-gradient(90deg, var(--fondo-linea) 1px, transparent 1px);
  background-size: 300px 300px, 300px 300px, 60px 60px, 60px 60px;
  background-position: 0 0;
  overflow: hidden;
}

/* ---------- diapositivas ---------- */
#slides, .slide { position: absolute; inset: 0; }
.slide { display: none; padding: 150px 120px 150px 120px; }
.slide.activa { display: block; }
.slide.portada { padding-top: 120px; }

.etiqueta {
  position: absolute; left: 120px; top: 44px;
  display: flex; align-items: center; gap: 18px;
  padding: 12px 26px 12px 56px;
  background: var(--papel);
  clip-path: polygon(24px 0, 100% 0, 100% 100%, 24px 100%, 0 50%);
  filter: drop-shadow(0 2px 0 rgba(24, 34, 45, .15));
  min-height: 62px;
}
.etiqueta::before {
  content: ""; position: absolute; left: 22px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--acento); box-shadow: inset 0 0 0 3px var(--papel);
}
.etq-nombre { font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 650; font-size: 28px; letter-spacing: .01em; }
.etq-quien { font-size: 22px; color: var(--tinta-2); border-left: 2px solid var(--mesa-linea-fuerte); padding-left: 18px; }
.etq-quien b { font-weight: 600; color: var(--tinta); }

.titulo {
  font-family: var(--display); font-variation-settings: "wdth" 86, "wght" 680;
  font-size: 72px; line-height: 1.02; letter-spacing: -.012em; max-width: 1480px;
  text-wrap: balance;
}
.titulo.medio { font-size: 58px; max-width: 1680px; line-height: 1.04; }
.sub { font-size: 34px; line-height: 1.3; color: var(--tinta-2); max-width: 1300px; margin-top: 22px; }
.texto { font-size: 30px; line-height: 1.38; color: var(--tinta); }
.texto.suave { color: var(--tinta-2); }
.chico { font-size: 24px; line-height: 1.35; color: var(--tinta-2); }
.fuerte { font-weight: 650; }
.cuerpo { margin-top: 40px; }

.grid { display: grid; gap: 48px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g-1-2 { grid-template-columns: 5fr 7fr; }
.g-2-1 { grid-template-columns: 7fr 5fr; }
.centro-v { align-items: center; }

.hoja {
  background: var(--papel);
  padding: 34px 38px;
  border-radius: 6px 6px 6px 22px;
  box-shadow: 0 1px 0 rgba(24, 34, 45, .12), 0 10px 24px -18px rgba(24, 34, 45, .35);
}
.cosido {
  position: relative; padding: 36px 40px; border-radius: 10px;
  background: rgba(251, 251, 248, .55);
}
.cosido::after {
  content: ""; position: absolute; inset: 9px; border: 2px dashed var(--tinta-3); border-radius: 6px; pointer-events: none; opacity: .6;
}
.cosido > * { position: relative; z-index: 1; }

.cifra { font-family: var(--display); font-variation-settings: "wdth" 80, "wght" 700; font-size: 150px; line-height: .92; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cifra.med { font-size: 104px; }
.cifra.hilo { color: var(--hilo); }
.cifra.verde { color: var(--verde); }
.leyenda { font-size: 27px; line-height: 1.3; color: var(--tinta-2); margin-top: 10px; max-width: 640px; }

.pregunta { font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 620; font-size: 30px; color: var(--verde); }
.respuesta { font-size: 29px; line-height: 1.3; margin-top: 6px; }

.sello {
  display: inline-block; padding: 4px 16px; border-radius: 999px;
  font-size: 22px; font-weight: 600; background: var(--verde-claro); color: var(--verde);
}
.sello.hilo { background: var(--hilo-claro); color: var(--hilo); }
.sello.gris { background: #e1e5e8; color: var(--tinta-2); }

svg text { font-family: var(--texto); fill: var(--tinta); }
svg .disp { font-family: var(--display); font-variation-settings: "wdth" 86, "wght" 640; }
svg .suave { fill: var(--tinta-2); }
svg .eje { stroke: var(--tinta-3); stroke-width: 1.5; }
svg .rejilla { stroke: var(--mesa-linea-fuerte); stroke-width: 1.5; stroke-dasharray: 5 7; }

/* ---------- cinta métrica (cronómetro) ---------- */
#cinta {
  position: absolute; left: 0; right: 0; bottom: 0; height: 104px;
  background: var(--cinta);
  border-top: 3px solid var(--tinta);
  box-shadow: 0 -10px 22px -14px rgba(24, 34, 45, .45);
}
#cinta svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#cinta .num { font-family: var(--display); font-variation-settings: "wdth" 80, "wght" 700; font-size: 25px; fill: var(--tinta); }
#cinta .tick { stroke: var(--tinta); stroke-width: 2; }
#cinta .paso { cursor: pointer; }
#cinta .paso polygon { fill: var(--tinta); }
#cinta .paso.actual polygon { fill: var(--hilo); }
#cinta .paso:hover polygon { fill: var(--hilo); }
#cinta .clip line { stroke: var(--hilo); stroke-width: 4; }
#cinta .clip rect { fill: var(--hilo); }
#cinta .clip text { fill: #fff; font-family: var(--display); font-variation-settings: "wdth" 80, "wght" 700; font-size: 24px; }
#cinta.pasado .clip rect { fill: var(--tinta); }
#cinta .clip { transition: transform .25s linear; }

#controles { position: absolute; right: 54px; top: 44px; display: flex; gap: 10px; z-index: 5; }
#controles button {
  font: 600 20px var(--texto); color: var(--tinta); background: var(--papel);
  border: 2px solid var(--tinta); border-radius: 6px; padding: 8px 16px; cursor: pointer;
  box-shadow: 0 3px 0 var(--tinta);
}
#controles button:hover { background: #fff; }
#controles button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }
#controles button:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, .paso:focus-visible {
  outline: 4px solid var(--azul); outline-offset: 3px;
}
#controles button.on { background: var(--tinta); color: #fff; }

#notas {
  position: absolute; right: 0; top: 0; bottom: 104px; width: 600px; z-index: 6;
  background: var(--tinta); color: #eef2ee; padding: 44px 46px; overflow: auto;
  box-shadow: -18px 0 40px -20px rgba(0, 0, 0, .55);
}
#notas h3 { font-family: var(--display); font-variation-settings: "wdth" 86, "wght" 650; font-size: 34px; margin-bottom: 14px; }
#notas p, #notas li { font-size: 26px; line-height: 1.4; color: #dbe3dd; margin-bottom: 12px; }
#notas ul { padding-left: 28px; }
#notas .meta { color: var(--cinta); font-weight: 600; margin-bottom: 18px; }

#vista { position: absolute; inset: 0; bottom: 104px; z-index: 7; background: rgba(24, 34, 45, .94); padding: 54px 70px; overflow: auto; }
#vista h3 { color: #fff; font-family: var(--display); font-variation-settings: "wdth" 86, "wght" 650; font-size: 40px; margin-bottom: 26px; }
#vista .rejilla-v { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
#vista button {
  text-align: left; background: var(--papel); border: 0; border-radius: 6px 6px 6px 18px; padding: 20px 22px; cursor: pointer;
  font: 400 22px var(--texto); color: var(--tinta); min-height: 140px;
}
#vista button b { display: block; font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 650; font-size: 27px; line-height: 1.1; margin-bottom: 8px; }
#vista button span { color: var(--tinta-3); }
#vista button.actual { outline: 4px solid var(--cinta); }
#vista .anexos { margin: 34px 0 18px; color: #c5d0c8; font-size: 26px; }

/* ---------- portada ---------- */
.portada .titulo { font-size: 112px; line-height: .98; max-width: 1020px; margin-top: 56px; }
.portada .sub { max-width: 940px; margin-top: 30px; }
.equipo-lista { margin-top: 36px; display: grid; grid-template-columns: repeat(2, max-content); gap: 8px 56px; }
.equipo-lista div { font-size: 25px; color: var(--tinta-2); display: flex; gap: 14px; white-space: nowrap; }
.equipo-lista b { color: var(--tinta); font-weight: 600; }

/* ---------- dominio ---------- */
.recorrido { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 52px; align-items: stretch; }
.estacion { position: relative; padding: 30px 30px 30px 34px; background: var(--papel); margin-right: 44px; border-radius: 6px 6px 6px 22px; box-shadow: 0 1px 0 rgba(24, 34, 45, .12); min-height: 270px; }
.estacion:last-child { margin-right: 0; }
.estacion:not(:last-child)::after {
  content: ""; position: absolute; right: -44px; top: 50%; width: 44px; height: 4px; background: var(--tinta); margin-top: -2px;
}
.estacion:not(:last-child)::before {
  content: ""; position: absolute; right: -50px; top: 50%; margin-top: -11px; border-left: 14px solid var(--tinta); border-top: 11px solid transparent; border-bottom: 11px solid transparent; z-index: 2;
}
.estacion h4 { font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 660; font-size: 36px; line-height: 1.05; margin-bottom: 14px; }
.estacion p { font-size: 25px; line-height: 1.35; color: var(--tinta-2); }
.estacion.clave { background: var(--hilo); }
.estacion.clave h4, .estacion.clave p { color: #fff; }
.partido { display: flex; height: 40px; margin-top: 18px; border-radius: 4px; overflow: hidden; font: 700 22px var(--display); }
.partido div { display: grid; place-items: center; color: #fff; }

/* ---------- aplicación ---------- */
.sim { display: grid; grid-template-columns: 800px 1fr; gap: 40px; margin-top: 8px; }
.sim h5 { font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 640; font-size: 22px; margin: 0 0 6px; color: var(--tinta-2); }
.bloque-sim { margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 600 20px var(--texto); padding: 5px 12px; border-radius: 4px 4px 4px 11px; cursor: pointer;
  background: var(--papel); color: var(--tinta); border: 2px solid var(--mesa-linea-fuerte);
}
.chip:hover { border-color: var(--tinta-3); }
.chip.on.pidio { background: var(--verde); border-color: var(--verde); color: #fff; }
.chip.on.ofrecio { background: var(--azul); border-color: var(--azul); color: #fff; }
.campos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; }
.campo label { display: block; font-size: 18px; line-height: 1.1; color: var(--tinta-2); margin-bottom: 3px; min-height: 40px; }
.campo select, .campo input {
  width: 100%; font: 600 22px var(--texto); padding: 4px 8px; border: 2px solid var(--mesa-linea-fuerte); border-radius: 4px; background: var(--papel); color: var(--tinta);
}
.campo .derivado { font-size: 22px; font-weight: 600; padding: 5px 0; }
.ejemplos { display: flex; flex-wrap: wrap; gap: 8px; }
.ejemplos button { font: 600 19px var(--texto); padding: 4px 12px; border: 2px solid var(--tinta); background: transparent; border-radius: 999px; cursor: pointer; color: var(--tinta); }
.ejemplos button:hover { background: var(--tinta); color: #fff; }
.tarjetas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modelo { background: var(--papel); border-radius: 6px 6px 6px 20px; padding: 9px 22px 9px; box-shadow: 0 1px 0 rgba(24, 34, 45, .12); border-top: 8px solid var(--gris); }
.modelo.arbol { border-top-color: var(--azul); }
.modelo.bosque { border-top-color: var(--violeta); }
.modelo.mlp { border-top-color: var(--naranja); }
.modelo .nombre { font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 650; font-size: 28px; display: flex; justify-content: space-between; align-items: baseline; }
.modelo .nombre small { font: 500 20px var(--texto); color: var(--tinta-3); }
.modelo .prob { font-family: var(--display); font-variation-settings: "wdth" 80, "wght" 700; font-size: 58px; line-height: 1; margin-top: 0; font-variant-numeric: tabular-nums; }
.barra { height: 16px; background: var(--mesa); border-radius: 3px; margin-top: 8px; position: relative; overflow: hidden; }
.barra i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--gris); transition: width .35s ease; }
.barra::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 3px; background: var(--tinta); }
.modelo.arbol .barra i { background: var(--azul); }
.modelo.bosque .barra i { background: var(--violeta); }
.modelo.mlp .barra i { background: var(--naranja); }
.modelo .veredicto { font-size: 21px; margin-top: 6px; font-weight: 600; line-height: 1.15; min-height: 24px; }
.modelo .veredicto.si { color: var(--hilo); }
.modelo .veredicto.no { color: var(--verde); }
.modelo .extra { font-size: 19px; line-height: 1.2; color: var(--tinta-3); margin-top: 2px; min-height: 22px; }
.porque { margin-top: 10px; background: rgba(251, 251, 248, .8); border-left: 8px solid var(--azul); padding: 8px 24px; border-radius: 4px; }
.porque h5 { margin-bottom: 4px; }
.porque ol { padding-left: 30px; font-size: 20px; line-height: 1.22; columns: 2; column-gap: 34px; }
.porque li { break-inside: avoid; }
.porque li b { color: var(--azul); }

/* ---------- árbol explorable ---------- */
.arbol-svg { margin-top: 6px; }
.arbol-svg svg { display: block; overflow: visible; }
.arbol-svg .hoja-svg:hover rect:first-of-type { fill: #fff3c2; }
.camino-arbol { display: flex; align-items: center; gap: 22px; margin-top: 12px; padding: 12px 22px; background: var(--papel); border-left: 10px solid #f2c230; border-radius: 4px 6px 6px 4px; box-shadow: 0 2px 0 rgba(24, 34, 45, .12); }
.quien-arbol { flex: none; font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 700; font-size: 22px; line-height: 1.1; width: 120px; }
.pasos-arbol { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; font-size: 20px; }
.paso-arbol { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; background: #fff3c2; border-radius: 16px; }
.paso-arbol b { padding: 1px 12px; border-radius: 13px; color: #fff; font-size: 19px; }
.paso-arbol b.si { background: var(--tinta); }
.paso-arbol b.no { background: #8a94a0; }
.flecha-arbol { font-style: normal; font-size: 26px; color: var(--tinta-3); padding: 0 2px; }
.fin-arbol { padding: 5px 16px; border-radius: 16px; color: #fff; font-weight: 700; font-size: 21px; }
.hint-arbol { flex: none; width: 190px; font-size: 18px; line-height: 1.2; color: var(--tinta-3); }
.boton-arbol { flex: none; font: inherit; font-size: 19px; font-weight: 650; padding: 8px 16px; border: 2px solid var(--tinta); border-radius: 6px; background: var(--papel); color: var(--tinta); cursor: pointer; }
.boton-arbol:hover { background: #fff3c2; }

/* ---------- tablas ---------- */
table.tabla { border-collapse: collapse; width: 100%; font-size: 26px; background: var(--papel); }
table.tabla th, table.tabla td { padding: 12px 18px; text-align: right; border-bottom: 2px solid var(--mesa); font-variant-numeric: tabular-nums; }
table.tabla th:first-child, table.tabla td:first-child { text-align: left; }
table.tabla th { font-family: var(--display); font-variation-settings: "wdth" 88, "wght" 650; font-size: 24px; color: var(--tinta-2); background: rgba(24, 34, 45, .05); }
table.tabla tr.mejor td { background: #fff3c2; font-weight: 600; }
.puntos { list-style: none; }
.puntos li { font-size: 30px; line-height: 1.32; padding: 0 0 14px 40px; position: relative; }
.puntos li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 16px; height: 16px; background: var(--verde); border-radius: 2px 2px 2px 8px; }
.puntos.hilo li::before { background: var(--hilo); }
.puntos.chico li { font-size: 27px; padding-bottom: 10px; }

[contenteditable] { outline: none; border-bottom: 2px dashed var(--mesa-linea-fuerte); min-width: 120px; display: inline-block; }
[contenteditable]:focus { border-bottom-color: var(--azul); background: #fff; }
.rol-fila { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 20px; align-items: baseline; padding: 14px 0; border-bottom: 2px solid var(--mesa-linea-fuerte); font-size: 29px; }
.rol-fila .rol { color: var(--tinta-2); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

@media print {
  html, body { overflow: visible; background: #fff; height: auto; }
  #marco { position: static; display: block; }
  #escenario { position: static; transform: none !important; width: auto; height: auto; background: #fff; overflow: visible; }
  #slides, .slide { position: static; }
  .slide { display: block !important; width: 1920px; height: 1080px; page-break-after: always; position: relative; background-color: var(--mesa); background-image: linear-gradient(var(--fondo-linea) 1px, transparent 1px), linear-gradient(90deg, var(--fondo-linea) 1px, transparent 1px); background-size: 60px 60px; overflow: hidden; }
  #controles, #cinta, #notas, #vista { display: none !important; }
  @page { size: 1920px 1080px; margin: 0; }
}

/* ---------- recorrido de seis estaciones ---------- */
.recorrido.seis { grid-template-columns: repeat(6, 1fr); margin-top: 48px; }
.recorrido.seis .estacion { margin-right: 36px; padding: 20px 22px 20px 26px; min-height: 240px; }
.recorrido.seis .estacion h4 { font-size: 31px; }
.recorrido.seis .estacion p { font-size: 23px; }
.recorrido.seis .estacion:not(:last-child)::after { right: -36px; width: 36px; }
.recorrido.seis .estacion:not(:last-child)::before { right: -42px; }

/* ---------- matrices de confusión ---------- */
.mx-n { font-family: var(--display); font-variation-settings: "wdth" 86, "wght" 680; font-size: 30px; margin-bottom: 6px; }
.mx-g { display: grid; grid-template-columns: 112px 1fr 1fr; gap: 5px; align-items: stretch; }
.mx-h { font-size: 17px; line-height: 1.1; color: var(--tinta-2); text-align: center; padding-bottom: 2px; }
.mx-r { font-size: 17px; line-height: 1.1; color: var(--tinta-2); align-self: center; }
.mx-c { font-family: var(--display); font-variation-settings: "wdth" 80, "wght" 700; font-size: 40px; text-align: center; padding: 14px 0; border-radius: 3px; font-variant-numeric: tabular-nums; }

/* ---------- prioridad sugerida ---------- */
.prio { display: inline-block; font-size: 20px; font-weight: 700; margin-top: 3px; padding: 2px 12px; border-radius: 3px 3px 3px 10px; }
.prio.alta { background: var(--hilo); color: #fff; }
.prio.media { background: var(--naranja); color: var(--tinta); }
.prio.baja { background: var(--cinta); color: var(--tinta); }
.prio.base { background: var(--verde-claro); color: var(--verde); }
.puntos.chico.denso li { font-size: 23px; padding-bottom: 6px; }

/* ---------- cartel de la portada ---------- */
.cartel { position: absolute; right: 120px; top: 168px; width: 640px; background: var(--papel); border-top: 14px solid var(--verde); border-radius: 6px 6px 6px 30px; padding: 44px 48px 0; box-shadow: 0 1px 0 rgba(24, 34, 45, .12), 0 18px 34px -22px rgba(24, 34, 45, .45); overflow: hidden; }
.cartel-k { font-size: 26px; font-weight: 600; color: var(--verde); }
.cartel-t { font-family: var(--display); font-variation-settings: "wdth" 84, "wght" 700; font-size: 84px; line-height: 1; letter-spacing: -.012em; margin-top: 10px; }
.cartel-s { font-size: 28px; color: var(--tinta-2); margin-top: 16px; }
.cartel-f { font-size: 26px; color: var(--tinta-2); margin-top: 38px; line-height: 1.35; }
.cartel-f b { font-family: var(--display); font-variation-settings: "wdth" 86, "wght" 680; font-size: 38px; color: var(--tinta); }

<script>
(function (raiz) {
  function predecirArbol(a, x) {
    let i = 0;
    while (a.f[i] >= 0) i = x[a.f[i]] <= a.t[i] ? a.l[i] : a.r[i];
    return a.p[i];
  }

  function caminoArbol(a, x) {
    const pasos = [];
    let i = 0;
    while (a.f[i] >= 0) {
      const izquierda = x[a.f[i]] <= a.t[i];
      pasos.push({ nodo: i, variable: a.f[i], umbral: a.t[i], izquierda });
      i = izquierda ? a.l[i] : a.r[i];
    }
    return { pasos, hoja: i, probabilidad: a.pn ? a.pn[i] : a.p[i], muestras: a.n ? a.n[i] : null };
  }

  function predecirBosque(arboles, x) {
    let suma = 0;
    for (const a of arboles) suma += predecirArbol(a, x);
    return suma / arboles.length;
  }

  function votosBosque(arboles, x) {
    let votos = 0;
    for (const a of arboles) if (predecirArbol(a, x) >= 0.5) votos += 1;
    return votos;
  }

  function predecirMLP(m, x) {
    let h = x.map((v, i) => (v - m.media[i]) / m.escala[i]);
    const capas = m.pesos.length;
    for (let c = 0; c < capas; c++) {
      const w = m.pesos[c], b = m.sesgos[c];
      const salida = new Array(b.length);
      for (let j = 0; j < b.length; j++) {
        let s = b[j];
        for (let i = 0; i < h.length; i++) s += h[i] * w[i][j];
        salida[j] = c < capas - 1 ? Math.max(0, s) : s;
      }
      h = salida;
    }
    return 1 / (1 + Math.exp(-h[0]));
  }

  // Proporción de chats de octubre con un puntaje mayor: "está entre el X % de arriba".
  function posicionEnRanking(cuantiles, p) {
    let menores = 0;
    for (let i = 0; i < cuantiles.length; i++) if (cuantiles[i] < p) menores = i;
    if (p > cuantiles[cuantiles.length - 1]) menores = 100;
    return Math.max(1, 100 - menores);
  }

  function predecirTodos(modelos, x) {
    return {
      dummy: modelos.dummy.p,
      arbol: predecirArbol(modelos.arbol, x),
      bosque: predecirBosque(modelos.bosque, x),
      mlp: predecirMLP(modelos.mlp, x),
    };
  }

  raiz.motor = { predecirArbol, caminoArbol, predecirBosque, votosBosque, predecirMLP, posicionEnRanking, predecirTodos };
  if (typeof module !== "undefined" && module.exports) module.exports = raiz.motor;

    if (Array.isArray(guardado)) guardado.forEach((g, i) => { if (EQUIPO[i] && g && g.nombre && !/^Integrante [0-9]+$/.test(g.nombre)) EQUIPO[i].nombre = g.nombre; });
    if (localStorage.getItem("cdd_equipo_nombres_v1") !== "1") {
      EQUIPO[0].nombre = "Eliel Lanzillotta";
      EQUIPO[1].nombre = "Nicolas Iglesias";
      localStorage.setItem("cdd_equipo", JSON.stringify(EQUIPO));
      localStorage.setItem("cdd_equipo_nombres_v1", "1");
    }
  } catch (e) { /* sin almacenamiento: se usan los nombres por defecto */ }
  const guardarEquipo = () => { try { localStorage.setItem("cdd_equipo", JSON.stringify(EQUIPO)); } catch (e) { /* ignorar */ } };

  /* ---------- simulador: de la descripción del chat al vector de 56 variables ---------- */
  const FAM = DATOS.familias_ids;
  const FAM_NOMBRE = DATOS.familias_nombres;
  const VISIBLES = ["broches", "ambos", "chalecos", "cintas", "elasticos"];
  const FAM_SIM = FAM.map((id, i) => [id, FAM_NOMBRE[i]]).filter(([id]) => VISIBLES.includes(id));
  const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const sim = { pide: new Set(["broches"]), ofrece: new Set(["broches"]), dia: 1, hora: 15, texto: 1, media: 0, bot: 1, seg: 12 };

  const enHorario = (dia, hora) => dia <= 4 && ((hora >= 8 && hora <= 12) || (hora >= 14 && hora <= 17));

  function vectorDe(s) {
    const f = {};
    const pide = FAM.filter((id) => s.pide.has(id));
    const ofrece = FAM.filter((id) => s.ofrece.has(id));
    const coincide = pide.filter((id) => s.ofrece.has(id));
    for (const id of FAM) {
      f["requested_" + id] = s.pide.has(id) ? 1 : 0;
      f["offered_" + id] = s.ofrece.has(id) ? 1 : 0;
      f["matched_" + id] = s.pide.has(id) && s.ofrece.has(id) ? 1 : 0;
    }
    f.requested_family_count = pide.length;
    f.offered_family_count = ofrece.length;
    f.matched_family_count = coincide.length;
    f.request_family_detected = pide.length > 0 ? 1 : 0;
    f.request_family_not_detected = pide.length > 0 ? 0 : 1;
    f.offer_family_detected = ofrece.length > 0 ? 1 : 0;
    f.offer_family_not_detected = ofrece.length > 0 ? 0 : 1;
    f.has_matching_family = coincide.length > 0 ? 1 : 0;
    f.has_unmatched_request = pide.some((id) => !s.ofrece.has(id)) ? 1 : 0;
    f.has_additional_offer = ofrece.some((id) => !s.pide.has(id)) ? 1 : 0;
    f.request_text_available = s.texto > 0 ? 1 : 0;
    f.prefix_inbound = s.texto + s.media;
    f.prefix_bot_messages = s.bot;
    f.prefix_messages = s.texto + s.media + s.bot;
    f.prefix_duration_seconds = s.seg;
    f.hour = s.hora;
    f.weekday = s.dia;
    f.business_hours = enHorario(s.dia, s.hora) ? 1 : 0;
    f.inbound_text_messages = s.texto;
    f.inbound_nontext_messages = s.media;
    return DATOS.columnas.map((c) => {
      if (f[c] === undefined) throw new Error("Falta la variable " + c);
      return f[c];
    });
  }

  const EJEMPLOS = [
    { nombre: "Pide broches, el bot ofrece broches", pide: ["broches"], ofrece: ["broches"] },
    { nombre: "Pide ambos, el bot ofrece ambos", pide: ["ambos"], ofrece: ["ambos"] },
    { nombre: "Consulta sin producto", pide: [], ofrece: [] },
  ];

  /* ---------- descripción de reglas del árbol ---------- */
  const BIN = new Set(DATOS.binarias);
  const etiqueta = (i) => DATOS.etiquetas[DATOS.columnas[i]];

  /* ---------- gráficos SVG ---------- */
  const svg = (w, h, dentro) => `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">${dentro}</svg>`;

  function graficoFamilias() {
    const filas = R.familias.filter((f) => f.tasa !== null).sort((a, b) => b.tasa - a.tasa);
    const w = 1040, fila = 44, x0 = 330, ancho = 560, h = filas.length * fila + 84;
    let s = "";
    s += `<line class="rejilla" x1="${x0 + ancho / 2}" x2="${x0 + ancho / 2}" y1="20" y2="${h - 40}"/>`;
    s += `<text class="chico suave" x="${x0 + ancho / 2}" y="14" text-anchor="middle" font-size="21">mitad de los chats</text>`;
    filas.forEach((f, i) => {
      const y = 40 + i * fila;
      const chica = f.episodios < 30;
      const color = f.tasa < 0.35 ? COL.verde : f.tasa > 0.6 ? COL.hilo : COL.dummy;
      s += `<g opacity="${chica ? 0.42 : 1}">`;
      s += `<text x="${x0 - 18}" y="${y + 23}" text-anchor="end" font-size="26" font-weight="600">${esc(f.nombre)}</text>`;
      s += `<rect x="${x0}" y="${y}" width="${f.tasa * ancho}" height="30" fill="${color}" rx="3"/>`;
      s += `<text x="${x0 + f.tasa * ancho + 12}" y="${y + 24}" font-size="26" font-weight="700" class="disp">${pct(f.tasa)}</text>`;
      s += `<text x="${w - 4}" y="${y + 23}" text-anchor="end" font-size="22" class="suave">${num(f.episodios)} chats${chica ? "*" : ""}</text>`;
      s += `</g>`;
    });
    s += `<text x="0" y="${h - 8}" font-size="22" class="suave">* Menos de 30 chats: no sacar conclusiones.</text>`;
    return svg(w, h, s);
  }

  function graficoAblacion() {
    const w = 1040, h = 610, izq = 72, arriba = 54, abajo = 150, alto = h - arriba - abajo;
    const y = (v) => arriba + alto * (1 - (v - 0.4) / 0.6);
    const grupos = [
      ["operativas", ["Operativas +", "largo del mensaje", "(10)"]],
      ["operativas_sin_largo", ["Solo operativas", "(9)"]],
      ["completo", ["Todas", "(58, protocolo)"]],
      ["completo_sin_largo", ["Todas menos", "largo de texto", "(56)"]],
    ];
    const gw = (w - izq - 10) / 4;
    let s = "";
    for (let v = 0.4; v <= 1.0001; v += 0.1) {
      s += `<line class="rejilla" x1="${izq}" x2="${w - 10}" y1="${y(v)}" y2="${y(v)}"/><text x="${izq - 12}" y="${y(v) + 7}" text-anchor="end" font-size="21" class="suave">${dec(v, 1)}</text>`;
    }
    s += `<rect x="${izq + gw * 3 + 6}" y="${arriba - 14}" width="${gw - 12}" height="${alto + 14}" fill="#cfe3d9" opacity=".75" rx="4"/>`;
    const orden = ["arbol", "bosque", "mlp"];
    grupos.forEach(([g, etiquetas], gi) => {
      orden.forEach((m, mi) => {
        const v = R.metricas[g][m].ap;
        const bx = izq + gi * gw + (gw - 3 * 60 - 2 * 8) / 2 + mi * 68;
        s += `<rect x="${bx}" y="${y(v)}" width="60" height="${y(0.4) - y(v)}" fill="${COL[m]}" rx="3"/>`;
        s += `<text x="${bx + 30}" y="${y(v) - 9}" text-anchor="middle" font-size="24" font-weight="700" class="disp">${dec(v, 2)}</text>`;
      });
      etiquetas.forEach((t, ti) => { s += `<text x="${izq + gi * gw + gw / 2}" y="${h - abajo + 36 + ti * 29}" text-anchor="middle" font-size="25" font-weight="${ti === 0 ? 600 : 400}">${esc(t)}</text>`; });
    });
    const azar = R.metricas.completo_sin_largo.dummy.ap;
    s += `<line x1="${izq}" x2="${w - 10}" y1="${y(azar)}" y2="${y(azar)}" stroke="#18222d" stroke-width="3" stroke-dasharray="10 7"/>`;
    s += `<line x1="${izq + 460}" x2="${izq + 496}" y1="21" y2="21" stroke="#18222d" stroke-width="3" stroke-dasharray="8 5"/><text x="${izq + 506}" y="29" font-size="24" font-weight="600">Azar ${dec(azar, 2)}</text>`;
    orden.forEach((m, i) => { s += `<rect x="${izq + i * 150}" y="10" width="22" height="22" fill="${COL[m]}" rx="3"/><text x="${izq + i * 150 + 32}" y="29" font-size="24" font-weight="600">${NOMBRE[m]}</text>`; });
    return svg(w, h, s);
  }

  function graficoModelos() {
    const w = 1000, h = 540, izq = 72, arriba = 30, abajo = 80, alto = h - arriba - abajo;
    const y = (v) => arriba + alto * (1 - (v - 0.4) / 0.6);
    const orden = ["dummy", "arbol", "bosque", "mlp"], gw = (w - izq - 10) / orden.length;
    let s = "";
    for (let v = 0.4; v <= 1.0001; v += 0.1) {
      s += `<line class="rejilla" x1="${izq}" x2="${w - 10}" y1="${y(v)}" y2="${y(v)}"/><text x="${izq - 12}" y="${y(v) + 7}" text-anchor="end" font-size="21" class="suave">${dec(v, 1)}</text>`;
    }
    orden.forEach((m, i) => {
      const r = R.metricas[GRUPO][m], cx = izq + i * gw + gw / 2;
      s += `<rect x="${cx - 62}" y="${y(r.ap)}" width="124" height="${y(0.4) - y(r.ap)}" fill="${COL[m]}" rx="4"/>`;
      s += `<line x1="${cx}" x2="${cx}" y1="${y(r.ic_alto)}" y2="${y(r.ic_bajo)}" stroke="#18222d" stroke-width="3"/><line x1="${cx - 14}" x2="${cx + 14}" y1="${y(r.ic_alto)}" y2="${y(r.ic_alto)}" stroke="#18222d" stroke-width="3"/><line x1="${cx - 14}" x2="${cx + 14}" y1="${y(r.ic_bajo)}" y2="${y(r.ic_bajo)}" stroke="#18222d" stroke-width="3"/>`;
      s += `<text x="${cx}" y="${y(r.ic_alto) - 12}" text-anchor="middle" font-size="30" font-weight="700" class="disp">${dec(r.ap, 2)}</text>`;
      s += `<text x="${cx}" y="${h - abajo + 40}" text-anchor="middle" font-size="28" font-weight="600">${NOMBRE[m]}</text>`;
    });
    return svg(w, h, s);
  }

  function graficoGrupos() {
    const filas = R.tramos[GRUPO + "/bosque"].filas;
    const w = 1000, h = 470, izq = 60, arriba = 40, abajo = 100, alto = h - arriba - abajo;
    const y = (v) => arriba + alto * (1 - v);
    const gw = (w - izq - 10) / filas.length;
    let s = "";
    for (let v = 0; v <= 1.0001; v += 0.25) s += `<line class="rejilla" x1="${izq}" x2="${w - 10}" y1="${y(v)}" y2="${y(v)}"/><text x="${izq - 12}" y="${y(v) + 7}" text-anchor="end" font-size="21" class="suave">${Math.round(v * 100)}</text>`;
    filas.forEach((f, i) => {
      const cx = izq + i * gw + gw / 2;
      const color = f.tasa_respuesta > 0.6 ? COL.hilo : f.tasa_respuesta < 0.3 ? COL.verde : COL.dummy;
      s += `<rect x="${cx - 58}" y="${y(f.tasa_respuesta)}" width="116" height="${y(0) - y(f.tasa_respuesta)}" fill="${color}" rx="4"/>`;
      s += `<text x="${cx}" y="${y(f.tasa_respuesta) - 11}" text-anchor="middle" font-size="36" font-weight="700" class="disp">${Math.round(f.tasa_respuesta * 100)} %</text>`;
      const nombres = ["Más alto", "Alto", "Medio", "Bajo", "Más bajo"];
      s += `<text x="${cx}" y="${h - abajo + 40}" text-anchor="middle" font-size="28" font-weight="700">${nombres[i] || "Tramo " + (i + 1)}</text>`;
      s += `<text x="${cx}" y="${h - abajo + 70}" text-anchor="middle" font-size="22" class="suave">${i * 20}–${(i + 1) * 20} %</text>`;
    });
    return svg(w, h, s);
  }

  function graficoBloques() {
    const filas = [...R.bloques].sort((a, b) => b.caida_ap - a.caida_ap);
    const w = 1000, fila = 64, h = filas.length * fila + 20, x0 = 330, maximo = Math.max(...filas.map((f) => f.caida_ap));
    let s = "";
    filas.forEach((f, i) => {
      const y = 10 + i * fila, l = (f.caida_ap / maximo) * 520;
      s += `<text x="${x0 - 18}" y="${y + 33}" text-anchor="end" font-size="26" font-weight="600">${esc(f.bloque)}</text>`;
      s += `<rect x="${x0}" y="${y + 6}" width="${l}" height="40" fill="${f.bloque === "Operativas" ? COL.dummy : COL.verde}" rx="3"/>`;
      s += `<text x="${x0 + l + 12}" y="${y + 36}" font-size="25" font-weight="700" class="disp">${dec(f.caida_ap, 3)}</text>`;
    });
    return svg(w, h, s);
  }

  /* ---------- árbol navegable ---------- */
  /* ---------- árbol: diagrama de flujo, grosor = cantidad de chats ---------- */
  const A = { caja: 222, alto: 56, hueco: 58, fila: 34, tope: 40, hojaX: 1402, hojaAncho: 278, pista: 100 };
  const colorProb = (p) => (p >= 0.7 ? "#cf432c" : p <= 0.3 ? "#1d5c4e" : "#8a94a0");

  // La pregunta de cada nodo, en una frase corta que se lee de corrido.
  function preguntaCorta(col, umbral) {
    if (col === "hour") return "¿Antes de las " + (Math.floor(umbral) + 1) + " h?";
    if (col === "weekday") {
      const k = Math.floor(umbral);
      return k === 1 ? "¿Lunes o martes?" : "¿De lunes a " + DIAS[k].toLowerCase() + "?";
    }
    if (col === "prefix_duration_seconds") return "¿El bot respondió en " + Math.floor(umbral) + " s o menos?";
    if (col === "prefix_messages") return "¿Hasta " + Math.floor(umbral) + " mensajes antes del bot?";
    if (col === "matched_abrojos") return "¿Pidió abrojos y el bot los ofreció?";
    if (BIN.has(col)) return "¿" + DATOS.etiquetas[col] + "?";
    return DATOS.etiquetas[col] + " ≤ " + num(umbral, 1) + "?";
  }
  function partirLineas(texto, max) {
    const lineas = [""];
    for (const w of texto.split(" ")) {
      const ult = lineas[lineas.length - 1];
      if (ult && (ult + " " + w).length > max) lineas.push(w);
      else lineas[lineas.length - 1] = ult ? ult + " " + w : w;
    }
    return lineas;
  }

  let disenoArbolCache = null;
  function disenoArbol() {
    if (disenoArbolCache) return disenoArbolCache;
    const a = M.arbol, nodos = {}, hojas = [];
    (function rec(i, prof, padre, rama) {
      const nd = { i, prof, padre, rama, n: a.n[i], hoja: a.f[i] < 0 };
      nodos[i] = nd;
      if (nd.hoja) { nd.y = hojas.length; nd.p = a.pn[i]; hojas.push(i); return; }
      const col = DATOS.columnas[a.f[i]], bin = BIN.has(col);
      const si = bin ? a.r[i] : a.l[i], no = bin ? a.l[i] : a.r[i];
      nd.pregunta = preguntaCorta(col, a.t[i]);
      rec(si, prof + 1, i, "Sí");
      rec(no, prof + 1, i, "No");
      nd.y = (nodos[si].y + nodos[no].y) / 2;
    })(0, 0, null, null);
    disenoArbolCache = { nodos, hojas, total: a.n[0] };
    return disenoArbolCache;
  }

  function rutaHasta(i) {
    const { nodos } = disenoArbol(), ruta = [];
    for (let k = i; k !== null; k = nodos[k].padre) ruta.unshift(k);
    return ruta;
  }

  function arbolSVG(ruta) {
    const { nodos, hojas, total } = disenoArbol();
    const enRuta = new Set(ruta);
    const px = (prof) => prof * (A.caja + A.hueco);
    const py = (nd) => A.tope + nd.y * A.fila + A.fila / 2;
    const ancho = A.hojaX + A.hojaAncho, alto = A.tope + hojas.length * A.fila + 8;
    let enlaces = "", activos = "", etiquetas = "", cajas = "", filas = "";
    for (const nd of Object.values(nodos)) {
      if (nd.padre === null) continue;
      const pa = nodos[nd.padre];
      const x1 = px(pa.prof) + A.caja, y1 = py(pa);
      const x2 = nd.hoja ? A.hojaX : px(nd.prof), y2 = py(nd);
      const d = `M${x1},${y1} C${x1 + (x2 - x1) * 0.45},${y1} ${x2 - (x2 - x1) * 0.35},${y2} ${x2},${y2}`;
      const grosor = Math.max(3, (nd.n / total) * 34);
      const activo = enRuta.has(nd.i);
      const trazo = `<path d="${d}" fill="none" stroke="${activo ? "#f2c230" : "#d3d8dc"}" stroke-width="${activo ? Math.max(grosor, 9) : grosor}"/>`;
      if (activo) activos += trazo; else enlaces += trazo;
      const si = nd.rama === "Sí";
      etiquetas += `<g transform="translate(${x2 - 29},${y2})"><rect x="-19" y="-13" width="38" height="26" rx="13" fill="${si ? "#18222d" : "#fbfbf8"}" stroke="${si ? "#18222d" : "#6b7885"}" stroke-width="2"/><text y="7" text-anchor="middle" font-size="19" font-weight="700" style="fill:${si ? "#fff" : "#46535f"}">${nd.rama}</text></g>`;
    }
    for (const nd of Object.values(nodos)) {
      const act = enRuta.has(nd.i), y = py(nd);
      if (nd.hoja) {
        const c = colorProb(nd.p), p100 = Math.round(nd.p * 100);
        filas += `<g class="hoja-svg" data-hoja="${nd.i}" transform="translate(${A.hojaX},${y})" style="cursor:pointer">
          <title>${p100} de cada 100 terminan con una persona · ${num(nd.n)} chats de entrenamiento</title>
          <rect x="-6" y="-16" width="${A.hojaAncho + 6}" height="32" rx="6" fill="${act ? "#fff3c2" : "transparent"}" stroke="${act ? "#f2c230" : "none"}" stroke-width="2"/>
          <rect x="0" y="-11" width="${A.pista}" height="22" rx="4" fill="#e3e6e2"/>
          <rect x="0" y="-11" width="${Math.max(3, nd.p * A.pista)}" height="22" rx="4" fill="${c}"/>
          <text x="${A.pista + 58}" y="9" font-size="27" font-weight="800" class="disp" text-anchor="end" style="fill:${c}">${p100}</text>
          <text x="${A.pista + 66}" y="8" font-size="19" style="fill:#46535f">de 100</text></g>`;
      } else {
        const x = px(nd.prof), lineas = partirLineas(nd.pregunta, 19), fs = lineas.length > 2 ? 17 : 20;
        const t0 = y - ((lineas.length - 1) * (fs + 3)) / 2 + fs * 0.34;
        cajas += `<g><rect x="${x}" y="${y - A.alto / 2}" width="${A.caja}" height="${A.alto}" rx="9" fill="${act ? "#fff3c2" : "#fbfbf8"}" stroke="${act ? "#c99a00" : "#18222d"}" stroke-width="${act ? 3.5 : 2}"/>` +
          lineas.map((l, k) => `<text x="${x + A.caja / 2}" y="${t0 + k * (fs + 3)}" text-anchor="middle" font-size="${fs}" font-weight="650">${esc(l)}</text>`).join("") + `</g>`;
      }
    }
    const cab = `<text x="0" y="22" font-size="20" style="fill:#46535f">Entran los ${num(total)} chats de entrenamiento y se reparten según las respuestas. Cuanto más grueso el camino, más chats pasan por él.</text>
      <text x="${A.hojaX}" y="22" font-size="20" font-weight="700">Terminan con persona</text>`;
    return `<svg viewBox="0 0 ${ancho} ${alto}" width="100%" role="img" aria-label="Árbol de decisión: cada pregunta divide los chats en dos grupos, hasta llegar a 16 hojas con el porcentaje que termina con una persona" xmlns="http://www.w3.org/2000/svg">${cab}${enlaces}${activos}${etiquetas}${cajas}${filas}</svg>`;
  }

  function arbolCamino(ruta, propio) {
    const { nodos } = disenoArbol();
    const hoja = nodos[ruta[ruta.length - 1]], c = colorProb(hoja.p);
    const pasos = ruta.slice(0, -1).map((id, k) => `<span class="paso-arbol"><span>${esc(nodos[id].pregunta)}</span><b class="${nodos[ruta[k + 1]].rama === "Sí" ? "si" : "no"}">${nodos[ruta[k + 1]].rama}</b></span>`).join('<i class="flecha-arbol">›</i>');
    const fin = `<span class="fin-arbol" style="background:${c}">${Math.round(hoja.p * 100)} de 100 terminan con una persona</span>`;
    const mano = propio
      ? `<span class="hint-arbol">Tocá cualquier hoja del árbol para ver su recorrido</span>`
      : `<button type="button" id="s-volver" class="boton-arbol">Volver a mi chat</button>`;
    return `<div class="camino-arbol"><span class="quien-arbol">${propio ? "El chat que armaste" : "Recorrido elegido"}</span><div class="pasos-arbol">${pasos}<i class="flecha-arbol">›</i>${fin}</div>${mano}</div>`;
  }

  /* ---------- diapositivas ---------- */
  const top20 = () => R.top_k[GRUPO + "/bosque"].find((f) => f.fraccion === 0.2);
  const ap = (g, m) => R.metricas[g][m].ap;

  function etiquetaHTML(texto, quien) {
    const q = quien === null ? "" : `<span class="etq-quien">Presenta <b data-quien="${quien}">${esc(EQUIPO[quien].nombre)}</b></span>`;
    return `<div class="etiqueta"><span class="etq-nombre">${esc(texto)}</span>${q}</div>`;
  }

  function lineaDeTiempo() {
    const P = R.particiones, total = P.train.episodios + P.validation.episodios + P.test.episodios + P.purgado.episodios;
    const ancho = 1680, purga = P.purgado.episodios / 2;
    const w = (n) => Math.max(26, (n / total) * ancho);
    const tramos = [
      ["Train", `hasta el 31/8 · ${num(P.train.episodios)} chats`, P.train.episodios, "#1d5c4e", "#fff", "El modelo aprende acá"],
      ["", "", purga, "#8a94a0", "#fff", "purga"],
      ["Validation", `septiembre · ${num(P.validation.episodios)} chats`, P.validation.episodios, "#f2c230", "#18222d", "Se elige la configuración"],
      ["", "", purga, "#8a94a0", "#fff", "purga"],
      ["Test", `octubre · ${num(P.test.episodios)} chats`, P.test.episodios, "#cf432c", "#fff", "Nota final, una sola vez"],
    ];
    const suma = tramos.reduce((a, t) => a + w(t[2]), 0), k = ancho / suma;
    let x = 0, s = "";
    for (const [n, d, cant, fondo, texto, leyenda] of tramos) {

  const cinta = document.getElementById("cinta");

  const xDe = (min) => X0 + min * POR_MIN;
  let tiempo = { corriendo: false, seg: 0, ultimo: 0 };
  function armarCinta() {
    let s = `<svg viewBox="0 0 1920 104" preserveAspectRatio="none">`;

    cinta.innerHTML = s;

      g.addEventListener("click", () => ir(Number(g.dataset.i)));

  }

    const anexos = SLIDES.map((s, i) => ({ s, i })).filter((x) => x.s.anexo);
    const boton = ({ s, i }) => `<button type="button" data-i="${i}" class="${i === actual ? "actual" : ""}"><b>${esc(s.corto)}</b><span>${esc(s.tag)}${s.anexo ? "" : " · " + num(s.min, 1) + " min"}</span></button>`;
    vista.innerHTML = `<h3>Vista general</h3><div class="rejilla-v">${normales.map(boton).join("")}</div><div class="anexos">Anexos para preguntas</div><div class="rejilla-v">${anexos.map(boton).join("")}</div>`;
    vista.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { vista.hidden = true; ir(Number(b.dataset.i)); }));
  }
  const alternar = (el, id) => { el.hidden = !el.hidden; document.getElementById(id).classList.toggle("on", !el.hidden); };
  document.getElementById("b-timer").addEventListener("click", alternarTimer);
  document.getElementById("b-reiniciar").addEventListener("click", reiniciarTimer);
  document.getElementById("b-notas").addEventListener("click", () => alternar(panelNotas, "b-notas"));
  document.getElementById("b-vista").addEventListener("click", () => { renderVista(); alternar(vista, "b-vista"); });
  const pantalla = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
  document.getElementById("b-pantalla").addEventListener("click", pantalla);

  /* ---------- simulador: eventos y render ---------- */
  let simListo = false;
  function enlazarSim() {
    if (simListo) return;
    simListo = true;
    const marcar = (cont, clave) => document.querySelectorAll(cont + " .chip").forEach((b) => {
      b.addEventListener("click", () => { const id = b.dataset.id; const c = sim[clave]; if (c.has(id)) c.delete(id); else c.add(id); renderSim(); });
    });
    marcar("#s-pide", "pide");
    marcar("#s-ofrece", "ofrece");
    document.querySelectorAll("#s-ejemplos button").forEach((b) => b.addEventListener("click", () => {
      const e = EJEMPLOS[Number(b.dataset.i)];
      sim.pide = new Set(e.pide); sim.ofrece = new Set(e.ofrece); sim.dia = 1; sim.hora = 15; sim.texto = 1; sim.media = 0; sim.bot = 1; sim.seg = 12;
      renderSim();
    }));
    const campo = (id, clave, min, max) => document.getElementById(id).addEventListener("input", (ev) => {
      const v = Number(ev.target.value);
      if (!Number.isFinite(v)) return;
      sim[clave] = Math.max(min, Math.min(max, Math.round(v)));
      renderSim();
    });
    campo("s-dia", "dia", 0, 6); campo("s-hora", "hora", 0, 23); campo("s-texto", "texto", 0, 6); campo("s-media", "media", 0, 3); campo("s-bot", "bot", 1, 5); campo("s-seg", "seg", 0, 3600);
  }
  function renderSim() {
    enlazarSim();
    document.querySelectorAll("#s-pide .chip").forEach((b) => { const on = sim.pide.has(b.dataset.id); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    document.querySelectorAll("#s-ofrece .chip").forEach((b) => { const on = sim.ofrece.has(b.dataset.id); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    const set = (id, v) => { const el = document.getElementById(id); if (el && document.activeElement !== el) el.value = v; };
    set("s-dia", sim.dia); set("s-hora", sim.hora); set("s-texto", sim.texto); set("s-media", sim.media); set("s-bot", sim.bot); set("s-seg", sim.seg);
    const horario = document.getElementById("s-horario");
    if (horario) horario.textContent = enHorario(sim.dia, sim.hora) ? "Sí" : "No";
    const x = vectorDe(sim);
    const p = motor.predecirTodos(M, x);
    const nivelDe = (arriba) => (arriba <= 30 ? { clase: "alta", texto: "Alta" } : arriba <= 50 ? { clase: "media", texto: "Media" } : arriba <= 70 ? { clase: "baja", texto: "Baja" } : { clase: "base", texto: "Base" });
    const prioridad = nivelDe(motor.posicionEnRanking(M.cuantiles_test.bosque, p.bosque));
    const NIV = { alta: ["Alta", "#cf432c", "#fff"], media: ["Media", "#d9822b", "#fff"], baja: ["Baja", "#f2c230", "#18222d"], base: ["Base", "#1d5c4e", "#fff"] };
    const arriba = (id) => motor.posicionEnRanking(M.cuantiles_test[id], p[id]);
    const total = R.particiones.test.episodios;
    const aB = arriba("bosque"), sobreB = Math.max(0, 100 - aB);
    const [nomN, colN, txtN] = NIV[prioridad.clase];
    const zonas = [["alta", 30], ["media", 20], ["baja", 20], ["base", 30]];
    const tira = zonas.map(([k, w]) => `<div style="width:${w}%;background:${NIV[k][1]};color:${NIV[k][2]};opacity:${k === prioridad.clase ? 1 : .35}">${NIV[k][0]}</div>`).join("");
    const fila = (id, rol) => {
      const [n, c, t] = NIV[nivelDe(arriba(id)).clase];
      const chip = id === "dummy" ? `<span class="res-nota">No mira el chat</span>` : `<span class="res-chip" style="background:${c};color:${t}">${n}</span>`;
      return `<div class="res-fila"><div><b>${NOMBRE[id]}</b><span>${rol}</span></div><div class="res-num">${Math.round(p[id] * 100)}</div>${chip}</div>`;
    };
    document.getElementById("s-tarjetas").innerHTML = `
      <div class="res-tit">Resultado para este chat</div>
      <div class="res-hero">
        <div class="res-cab"><span class="res-niv" style="background:${colN};color:${txtN}">Prioridad ${nomN}</span><span class="res-punt">Puntaje del bosque <b>${Math.round(p.bosque * 100)}</b> de 100</span></div>
        <div class="res-cola"><div class="res-tira">${tira}</div><div class="res-marca" style="left:${Math.min(99, Math.max(1, aB))}%"><i></i></div></div>
        <div class="res-pie">Los ${num(total)} chats de octubre, del puntaje más alto (izquierda) al más bajo. Este chat supera al ${sobreB} % de ellos.</div>
      </div>
      <div class="res-otros"><div class="res-sub">Lo que dicen los otros modelos</div>${fila("arbol", "el que explica")}${fila("mlp", "red neuronal")}${fila("dummy", "piso de comparación")}</div>`;
  }
  let arbolSel = null;
  function renderArbol(reiniciar) {
    if (reiniciar) arbolSel = null;
    const c = motor.caminoArbol(M.arbol, vectorDe(sim));
    const ruta = arbolSel === null ? c.pasos.map((p) => p.nodo).concat(c.hoja) : rutaHasta(arbolSel);
    document.getElementById("s-arbol").innerHTML = arbolSVG(ruta);
    document.getElementById("s-arbol-camino").innerHTML = arbolCamino(ruta, arbolSel === null);
  }
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (!t || !t.closest || !document.getElementById("s-arbol")) return;
    const hoja = t.closest("[data-hoja]");
    if (hoja && document.getElementById("s-arbol").contains(hoja)) { arbolSel = Number(hoja.dataset.hoja); renderArbol(); }
    else if (t.closest("#s-volver")) renderArbol(true);
  });

  /* ---------- edición de nombres ---------- */
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t && t.dataset && t.dataset.edit !== undefined) {
      const i = Number(t.dataset.edit);
      EQUIPO[i].nombre = t.textContent.trim() || "Integrante " + (i + 1);
      guardarEquipo();
      document.querySelectorAll('[data-quien="' + i + '"]').forEach((el) => { el.textContent = EQUIPO[i].nombre; });
    }
  });

  /* ---------- teclado y escala ---------- */
  document.getElementById("flecha-ant").addEventListener("click", () => ir(actual - 1));
  document.getElementById("flecha-sig").addEventListener("click", () => ir(actual + 1));
  document.addEventListener("keydown", (e) => {
    const t = e.target, k = e.key;
    const flecha = k === "ArrowRight" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowUp";
    const escribiendo = t && (t.isContentEditable || t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && !/^(number|range|checkbox|radio|button)$/.test(t.type || "text")));
    if (escribiendo) return;
    if (t && /INPUT|SELECT/.test(t.tagName) && !flecha) return;
    if (flecha && t && t.blur) t.blur();
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " ") { e.preventDefault(); ir(actual + 1); }
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp") { e.preventDefault(); ir(actual - 1); }
    else if (k === "Home") ir(0);
    else if (k === "End") ir(SLIDES.length - 1);
    else if (k === "t" || k === "T") alternarTimer();
    else if (k === "r" || k === "R") reiniciarTimer();
    else if (k === "n" || k === "N") alternar(panelNotas, "b-notas");
    else if (k === "g" || k === "G") { renderVista(); alternar(vista, "b-vista"); }
    else if (k === "f" || k === "F") pantalla();
    else if (k === "Escape") { panelNotas.hidden = true; vista.hidden = true; document.getElementById("b-notas").classList.remove("on"); document.getElementById("b-vista").classList.remove("on"); }
  });
  const escenario = document.getElementById("escenario");
  function escalar() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    escenario.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener("resize", escalar);
  escalar();

  armarCinta();
  pintarClip();
  const inicial = parseInt((location.hash || "").replace("#", ""), 10);
  ir(Number.isFinite(inicial) ? inicial - 1 : 0);
})();

</script>
</body>
</html>
